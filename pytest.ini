[pytest]
# Pytest configuration file

# Minimum version
minversion = 8.0

# Test paths
testpaths = .

# Test file patterns
python_files = test_*.py

# Test class patterns
python_classes = Test*

# Test function patterns
python_functions = test_*

# Async mode
asyncio_mode = auto

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    asyncio: mark test as async
    slow: mark test as slow running
